name: Secret Check

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify APP_TOKEN is set
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is set"
          else
            echo "APP_TOKEN is NOT set"
            exit 1
          fi
